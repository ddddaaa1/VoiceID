name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv sync --frozen --extra ml --extra api --extra persistence --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -W error -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/web/audio.test.mjs
      - run: uv run python scripts/verify_model_release.py model-registry/releases/voiceid-research-2026-08-25.json
      - run: uv run python scripts/monitor_score_drift.py monitoring/baselines/librispeech-clean-v2.json experiments/librispeech-clean-v2/scored-trials.json --partition evaluation
      - run: uv build --offline --no-build-isolation

  container:
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: voiceid:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate Compose deployment
        env:
          VOICEID_AUDIT_KEY: ci-compose-validation-only
          VOICEID_TEMPLATE_KEY: ci-compose-validation-only
        run: docker compose config --quiet
