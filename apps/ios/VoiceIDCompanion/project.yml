name: VoiceIDCompanion

options:
  bundleIdPrefix: dev.voiceid
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  xcodeVersion: "16.0"

packages:
  VoiceIDKit:
    path: ../../../sdk/swift/VoiceIDKit
  VoiceIDCompanionCore:
    path: CompanionCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  VoiceIDCompanion:
    type: application
    platform: iOS
    sources:
      - path: VoiceIDCompanion
        excludes:
          - Info.plist
    info:
      path: VoiceIDCompanion/Info.plist
      properties:
        CFBundleDisplayName: VoiceID
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSFaceIDUsageDescription: >-
          VoiceID uses Face ID only when server policy requires stronger device-owner authentication.
        NSLocalNetworkUsageDescription: >-
          VoiceID connects to a developer-hosted API during local testing.
        NSMicrophoneUsageDescription: >-
          VoiceID records a visible, bounded three-second sample to authorize the selected action.
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: VoiceIDKit
      - package: VoiceIDCompanionCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.voiceid.companion
        PRODUCT_NAME: VoiceID
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      gatherCoverageData: true
      testTargets: []
