[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceid"
version = "0.1.0"
description = "Speaker verification and voice anti-spoofing platform"
requires-python = ">=3.11,<3.15"

[project.optional-dependencies]
ml = [
    "speechbrain>=1.1,<1.2",
    "torch>=2.11,<2.12",
    "torchaudio>=2.11,<2.12",
]
dev = [
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
