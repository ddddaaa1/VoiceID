[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceid"
version = "0.1.0"
description = "Speaker verification and voice anti-spoofing platform"
requires-python = ">=3.11,<3.15"
license-files = ["LICENSES/*"]

[project.optional-dependencies]
ml = [
    "numpy>=2.3,<3",
    "soundfile>=0.13,<0.14",
    "speechbrain>=1.1,<1.2",
    "torch>=2.11,<2.12",
    "torchaudio>=2.11,<2.12",
]
api = [
    "fastapi>=0.141,<0.142",
    "python-multipart>=0.0.32,<0.1",
    "uvicorn>=0.52,<0.53",
]
persistence = [
    "cryptography>=50,<51",
]
dev = [
    "httpx2>=2.10,<3",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"voiceid.adapters.api" = ["web/*.html", "web/*.json", "web/assets/*"]
"voiceid.adapters.models" = ["assets/*.pth"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
extend-exclude = ["src/voiceid/adapters/models/vendor/aasist.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
